# Guías de ejemplo. Los pasos describen el procedimiento general; los datos son ficticios.
# Política: docs/verificacion-de-datos.md

- id: phone
  titulo: Bloquea tu SIM
  urgencia: ahora
  entidad_tipo: operador
  pasos:
    - Llama a tu operador desde otro teléfono.
    - Pide que suspendan tu línea.
    - Pide que bloqueen tu equipo con el IMEI.
    - Anota el número de referencia que te den.
  aviso: Bloquear el equipo dificulta que lo usen, pero no garantiza que quede inservible.
  sin_entidad: Si no sabes cuál es tu operador, busca el nombre en una factura o en el empaque de la SIM, o pregúntale a alguien que te haya llamado a ese número.
  sin_imei: El IMEI suele estar en la caja o en la factura del celular. Si no lo tienes, pide la suspensión con tu número de línea y pregunta al operador cómo bloquear el equipo.
  referencia_ejemplo: GES-0001
  fuente: https://ejemplo.com/guias/bloqueo-de-linea
  verificado: 2026-11-01
  vence: 2027-02-01

- id: card
  titulo: Bloquea tu tarjeta
  urgencia: ahora
  entidad_tipo: banco
  pasos:
    - Llama a tu banco por su línea oficial.
    - Pide que bloqueen la tarjeta.
    - Solicita una tarjeta nueva.
    - Revisa tus compras recientes y reporta las que no hiciste.
  sin_entidad: Si no sabes qué banco emitió la tarjeta, revisa tu extracto o la aplicación del banco desde otro dispositivo.
  referencia_ejemplo: GES-0002
  fuente: https://ejemplo.com/guias/bloqueo-de-tarjeta
  verificado: 2026-11-01
  vence: 2027-02-01

- id: passwords
  titulo: Cambia tus claves
  urgencia: hoy
  pasos:
    - Entra a tu correo desde otro dispositivo.
    - Cambia la contraseña.
    - Cierra las sesiones abiertas en otros equipos.
    - Repite con tu banco y tus redes sociales.
    - Revisa tus datos de recuperación (teléfono y correo alterno).
  referencia_ejemplo: persona@ejemplo.com
  fuente: https://ejemplo.com/guias/cambio-de-claves
  verificado: 2026-11-01
  vence: 2027-02-01

- id: report
  titulo: Pon la denuncia
  urgencia: hoy
  entidad_tipo: autoridad
  pasos:
    - Entra al portal de denuncias.
    - Cuenta qué pasó, cuándo y dónde.
    - Lista lo que te robaron.
    - Guarda el número de la denuncia.
  referencia_ejemplo: DEN-0000
  fuente: https://ejemplo.com/guias/denuncia
  verificado: 2026-11-01
  vence: 2027-02-01

- id: id-card
  titulo: Pide el duplicado de tu cédula
  urgencia: esta-semana
  entidad_tipo: identificacion
  pasos:
    - Revisa los requisitos para pedir el duplicado.
    - Pide el duplicado ante la entidad de identificación.
    - Si pusiste la denuncia, lleva el número. Es recomendable, no obligatorio.
    - Revisa con tu banco que nadie haya abierto productos a tu nombre.
  referencia_ejemplo: GES-0003
  fuente: https://ejemplo.com/guias/duplicado-de-documento
  verificado: 2026-11-01
  vence: 2027-02-01

- id: documents
  titulo: Reemplaza tus otros documentos
  urgencia: esta-semana
  pasos:
    - Haz una lista de los documentos que tenías.
    - Pregunta en cada entidad cómo pedir un duplicado.
    - Ten a mano el número de la denuncia por si te lo piden.
  referencia_ejemplo: GES-0004
  fuente: https://ejemplo.com/guias/otros-documentos
  verificado: 2026-11-01
  vence: 2027-02-01

- id: general
  titulo: Guía general
  urgencia: ahora
  pasos:
    - Si tenías celular, llama a tu operador desde otro teléfono y pide suspender la línea.
    - Si tenías tarjetas, llama a tu banco y pide bloquearlas.
    - Cambia la contraseña de tu correo desde otro dispositivo.
    - Pon la denuncia en el portal de denuncias y guarda el número.
  aviso: Cuando sepas qué te robaron, vuelve y arma tu plan completo.
  fuente: https://ejemplo.com/guias/general
  verificado: 2026-11-01
  vence: 2027-02-01
